[pytest]
markers =
    validate_csv: Marks tests related to CSV content validation.
    unmarked: Mark for tests that were not explicitly marked.

testpaths = tests
python_files = test_*.py


# added --reportportal here to activate the plugin automatically
addopts = --html=pytest_report.html --self-contained-html --reportportal

# REPORT PORTAL CONFIGURATION
rp_endpoint = https://reportportal.epam.com
rp_api_key = YOUR_API_KEY_HERE
rp_project = YOUR_PROJECT_NAME_HERE
rp_launch = My Pytest Homework Launch
rp_launch_attributes = Type:Homework Pytest:Introduction
rp_launch_description = Execution of Pytest Introduction homework
rp_ignore_errors = True