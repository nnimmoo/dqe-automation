[tool:pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version requirement
minversion = 8.0

# Add current directory to Python path
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --color=yes

# Custom markers (also defined in conftest.py for documentation)
markers =
    parquet_data: mark test as parquet data validation test
    postgres_data: mark test as postgres data validation test  
    data_transformation: mark test as data transformation validation test
    slow: mark test as slow running test (may take > 30 seconds)
    integration: mark test as integration test requiring external dependencies
    unit: mark test as unit test (fast, isolated)
    smoke: mark test as smoke test (basic functionality)
    regression: mark test as regression test

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeout (in seconds)
timeout = 300

